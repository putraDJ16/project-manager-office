name: Deploy main to server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        run: |
          SERVER_PORT="${{ secrets.SERVER_PORT }}"
          SERVER_PORT="${SERVER_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          ENV_PROD: ${{ secrets.ENV_PROD }}
        run: |
          SERVER_PORT="${SERVER_PORT:-22}"
          ENV_PROD_B64="$(printf '%s' "$ENV_PROD" | base64 -w 0)"

          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' ENV_PROD_B64='$ENV_PROD_B64' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_PATH"

          if [ -n "${ENV_PROD_B64:-}" ]; then
            printf '%s' "$ENV_PROD_B64" | base64 -d > .env.prod
            chmod 600 .env.prod
          fi

          git fetch origin main
          git pull --ff-only origin main

          docker compose -f docker-compose.prod.yml up -d --build
          docker image prune -f
          docker compose -f docker-compose.prod.yml ps
          REMOTE
