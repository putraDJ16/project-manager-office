version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: zoho_pmo_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zoho_pm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./CODE/be
      dockerfile: Dockerfile
    container_name: zoho_pmo_api
    depends_on:
      - db
    environment:
      - FLASK_ENV=development
      - FLASK_APP=run.py
      # The host in DATABASE_URL must match the db service name above
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/zoho_pm
      - JWT_SECRET_KEY=dev-secret-key
      - CORS_ORIGINS=http://localhost:5173
    ports:
      - "5000:5000"
    volumes:
      # Optional: bind mount for hot-reloading backend code during dev
      - ./CODE/be:/app
    restart: unless-stopped

  web:
    build:
      context: ./CODE/fe
      dockerfile: Dockerfile
    container_name: zoho_pmo_web
    depends_on:
      - api
    environment:
      - VITE_API_BASE_URL=/api/v1
      # Proxy target inside Docker must point to the api service name
      - VITE_PROXY_TARGET=http://api:5000
    ports:
      - "5173:5173"
    volumes:
      # Optional: bind mount for hot-reloading frontend code during dev
      - ./CODE/fe:/app
      - /app/node_modules # Prevent host node_modules from overwriting container node_modules
    restart: unless-stopped

volumes:
  postgres_data:
