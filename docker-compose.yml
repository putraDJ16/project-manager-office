version: '3.8'

services:
  api:
    build:
      context: ./CODE/be
      dockerfile: Dockerfile
    container_name: zoho_pmo_api

    environment:
      - FLASK_ENV=development
      - FLASK_APP=run.py
      # Local PostgreSQL on host machine
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@host.docker.internal:5434/zoho_pm
      - JWT_SECRET_KEY=dev-secret-key
      - CORS_ORIGINS=http://localhost:5173
    ports:
      - "5000:5000"
    volumes:
      # Optional: bind mount for hot-reloading backend code during dev
      - ./CODE/be:/app
    restart: unless-stopped

  web:
    build:
      context: ./CODE/fe
      dockerfile: Dockerfile
    container_name: zoho_pmo_web
    depends_on:
      - api
    environment:
      - VITE_API_BASE_URL=/api/v1
      # Proxy target inside Docker must point to the api service name
      - VITE_PROXY_TARGET=http://api:5000
    ports:
      - "5173:5173"
    volumes:
      # Optional: bind mount for hot-reloading frontend code during dev
      - ./CODE/fe:/app
      - /app/node_modules # Prevent host node_modules from overwriting container node_modules
    restart: unless-stopped

volumes:
  postgres_data:
